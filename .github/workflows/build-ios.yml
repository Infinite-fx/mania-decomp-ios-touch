name: Build iOS (unsigned, no game assets)

# Builds the decompilation with this patch set for iOS.
# The result contains NO game data: you must add Data.rsdk from your own legally purchased copy.
# As required by the RSDKv5 decompilation license, distributed builds have the Plus DLC disabled.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MANIA_COMMIT: 9dc699428420d752af9767bdb13f585ee0881bc0  # Sonic-Mania-Decompilation v1.1.1
  RSDK_COMMIT: bd5939658fa9987bd2d4384799cacd57aa432eec   # RSDKv5-Decompilation (submodule of the above)

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: touch

      - name: Get the decompilation (pinned)
        run: |
          git clone https://github.com/RSDKModding/Sonic-Mania-Decompilation decomp
          cd decomp
          git checkout "$MANIA_COMMIT"
          git submodule update --init --recursive
          git -C dependencies/RSDKv5 checkout "$RSDK_COMMIT"

      - name: Apply patches
        run: ./touch/apply.sh decomp

      - name: Fetch dependencies (SDL2, libogg, libtheora)
        run: |
          git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git deps/SDL2
          OGG=decomp/dependencies/RSDKv5/dependencies/android/libogg
          THEORA=decomp/dependencies/RSDKv5/dependencies/android/libtheora
          mkdir -p "$OGG" "$THEORA"
          curl -fsSL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz | tar xz --strip-components=1 -C "$OGG"
          curl -fsSL https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.bz2 | tar xj --strip-components=1 -C "$THEORA"

      - name: Configure
        run: |
          cmake -S decomp -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGAME_STATIC=ON \
            -DRETRO_MOD_LOADER=OFF \
            -DRETRO_DISABLE_PLUS=ON \
            -DSDL2_SOURCE_DIR="$PWD/deps/SDL2"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project build/SonicMania.xcodeproj -target RetroEngine -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error|BUILD|\*\*" | head -200

      - name: Package unsigned .ipa
        run: |
          APP=$(find build -type d -name "*.app" -path "*Release-iphoneos*" | head -1)
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry ManiaTouch-unsigned-noassets.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ManiaTouch-unsigned-noassets
          path: ManiaTouch-unsigned-noassets.ipa
          retention-days: 30
